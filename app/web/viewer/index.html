<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }

    #panel {
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 14px 16px 30px;
    }
    #panel section { margin-bottom: 18px; }
    #panel h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--dim); margin: 0 0 7px;
    }
    #panel dl.facts { font-size: 12.5px; grid-template-columns: 37% 1fr; gap: 2px 8px; }
    #panel dd { word-break: break-word; }
    #panel dd.waiting { color: var(--warn); }
    #panel dd.bad { color: var(--bad); }
    #panel dd.settled { color: var(--ok); }

    /* A bar says at a glance what a pair of numbers cannot. */
    #panel .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    #panel .meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s ease-out; }
    #panel .meter.settled > i { background: var(--ok); }
    #panel .caption { font-size: 12px; color: var(--dim); margin: 5px 0 7px; }

    /* Every row can explain itself: hover for one, or turn them all on at once. */
    #panel dt.explained { cursor: help; text-decoration: underline dotted var(--line); text-underline-offset: 3px; }
    #panel .hint { display: none; }
    #panel.explain .hint {
      display: block; grid-column: 1 / -1; margin: 1px 0 7px;
      font-size: 11.5px; line-height: 1.45; color: var(--dim);
    }
    .explain-switch {
      font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
      color: var(--dim); margin-bottom: 14px;
    }
    #panel details { margin-bottom: 18px; }
    #panel summary {
      cursor: pointer; font-size: 12px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--dim); margin-bottom: 7px;
    }

    .stage { position: relative; background: #0b0c0f; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }

    #error {
      position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
      background: var(--bad); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px;
    }

    #picker {
      position: absolute; inset: 0; background: rgba(8, 9, 12, .92);
      display: grid; place-items: center; z-index: 10; padding: 30px;
    }
    #picker .box {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 20px; max-width: 900px; width: 100%; max-height: 80vh; overflow: auto;
    }
    #pickerList { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    button.pick {
      display: flex; gap: 12px; align-items: center; text-align: left;
      padding: 10px; border-radius: 10px;
    }
    button.pick .thumb {
      width: 84px; height: 62px; border-radius: 6px; flex: none;
      background: #0b0c0f center/cover no-repeat; border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>Viewer</h1>
    <span class="meta" id="title">no image</span>
    <span class="spacer"></span>
    <button id="fit">Fit</button>
    <button id="change">Change image</button>
    <a href="/" target="_blank" rel="noopener">server page →</a>
  </header>

  <div class="layout">
    <aside id="panel"></aside>
    <div class="stage">
      <canvas id="canvas"></canvas>
      <div id="error" hidden></div>
      <div id="picker" hidden>
        <div class="box">
          <h2 style="margin-top:0">Choose an image</h2>
          <div id="pickerList"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/viewer/main.js"></script>
</body>
</html>
